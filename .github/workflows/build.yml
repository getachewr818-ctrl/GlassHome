name: Build GlassHome APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: github.event_name == 'push'
        run: gradle assembleDebug --no-daemon

      - name: Decode release signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/glasshome-release.jks"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/glasshome-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GlassHome-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GlassHome-release
          path: app/build/outputs/apk/release/app-release.apk
